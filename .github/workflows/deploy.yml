name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy → app.ppafan.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: NODE_ENV=production npm run build

      - name: Setup SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload backend
        run: |
          rsync -az --checksum \
            --exclude 'node_modules' \
            --exclude 'logs' \
            --exclude '.env*' \
            --exclude '*.log' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            backend/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/ppafan/backend/

      - name: Upload frontend
        run: |
          rsync -az --delete --checksum \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            frontend/dist/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/ppafan/frontend/dist/

      - name: Restart server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            cd /var/www/ppafan/backend
            npm install --production 2>&1 | tail -5
            if [ -f "ecosystem.config.js" ]; then
              pm2 reload ecosystem.config.js --update-env 2>/dev/null || \
              pm2 restart ecosystem.config.js --update-env 2>/dev/null || \
              { pm2 delete ppafan-backend 2>/dev/null || true; pm2 start ecosystem.config.js; }
            else
              pm2 restart ppafan-backend 2>/dev/null || pm2 start server.js --name ppafan-backend
            fi
            pm2 save --silent
            systemctl reload nginx 2>/dev/null || true
            echo "✓ Deployed"
          ENDSSH
